<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Novexar</title>
    <script>
      // GitHub Pages SPA fallback (spa-github-pages 方式)
      // 未知のパスへの直アクセスを ?/ 付きのクエリに変換してトップへリダイレクトし、
      // index.html 側のスクリプトが本来のURLへ復元する。
      // プロジェクトページ (novexar.github.io/Novexar-Official/) のためセグメント保持数は 1。
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
